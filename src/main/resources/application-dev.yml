management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    metrics:
      enabled: true
  metrics:
    tags:
      application: log4u          

spring:
  datasource:
    jdbc-url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  second-datasource:
    jdbc-url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  aws:
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: ${S3_BUCKET_NAME}

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_TIME_SECONDS}
  refresh-token-expire-time-seconds: ${JWT_REFRESH_TOKEN_EXPIRE_TIME_SECONDS}

logging:
  level:
    org:
      springframework: debug

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_DEV_CLIENT_ID:${naver.dev.client-id}} # 로컬 기본값
            client-secret: ${NAVER_DEV_CLIENT_SECRET:${naver.dev.client-secret}}
            redirect-uri: ${NAVER_DEV_REDIRECT_URI:${naver.dev.redirect-uri}}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - nickname

          google:
            client-name: google
            client-id: ${GOOGLE_DEV_CLIENT_ID:${google.dev.client-id}}
            client-secret: ${GOOGLE_DEV_CLIENT_SECRET:${google.dev.client-secret}}
            redirect-uri: ${GOOGLE_DEV_REDIRECT_URI:${google.dev.redirect-uri}}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_DEV_CLIENT_ID:${kakao.dev.client-id}}
            client-secret: ${KAKAO_DEV_CLIENT_SECRET:${kakao.dev.client-secret}}
            redirect-uri: ${KAKAO_DEV_REDIRECT_URI:${kakao.dev.redirect-uri}}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: kakao

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id